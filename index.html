<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Scanner NF</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Poppins', sans-serif;
      background: #f5f5f5;
      color: #1a1a1a;
      min-height: 100vh;
    }

    .screen { display: none; padding: 2rem 1.5rem; max-width: 480px; margin: 0 auto; }
    .screen.active { display: block; }

    .login-wrapper {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    #login-screen {
      background:
        linear-gradient(rgba(0,0,0,.55), rgba(0,0,0,.55)),
        url('images/login-bg.jpg') center / cover no-repeat;
      min-height: 100dvh;
    }

    .logo { text-align: center; margin-bottom: 2.5rem; }
    .logo svg { width: 56px; height: 56px; margin-bottom: 12px; }
    .logo h1 { font-size: 20px; font-weight: 600; color: #1a1a1a; }
    .logo p { font-size: 14px; color: #888; margin-top: 4px; }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 1.5rem;
      border: 1px solid #e5e5e5;
    }

    .field { margin-bottom: 1rem; }
    .field label { display: block; font-size: 13px; font-weight: 500; color: #555; margin-bottom: 6px; }

    input[type="text"], input[type="email"], input[type="number"] {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 14px;
      font-family: 'Poppins', sans-serif;
      color: #1a1a1a;
      background: #fafafa;
      outline: none;
    }
    
    input[type="text"]:focus, input[type="email"]:focus, input[type="number"]:focus { border-color: #1a1a1a; background: #fff; }

    .btn-primary {
      width: 100%;
      padding: 14px;
      background: #B92633;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-family: 'Poppins', sans-serif;
      font-weight: 500;
      cursor: pointer;
      margin-top: 0.5rem;
    }
    .btn-primary:active { opacity: 0.8; }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
      padding-top: 1rem;
    }

    .user-badge { display: flex; align-items: center; gap: 10px; }

    .avatar {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: #e8f0fe;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 600; color: #1a56db;
    }

    .user-name { font-size: 14px; font-weight: 500; }

    .btn-logout {
      font-size: 13px; color: #888; cursor: pointer;
      padding: 6px 12px; border: 1px solid #ddd;
      border-radius: 8px; background: #fff;
      font-family: 'Poppins', sans-serif;
    }

    .btn-camera {
      width: 100%;
      padding: 16px 14px;
      background: #1a1a1a;
      color: #fff;
      border: none;
      border-radius: 14px;
      font-size: 15px;
      font-family: 'Poppins', sans-serif;
      font-weight: 500;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      cursor: pointer;
      flex: 1;
    }
    .btn-camera.gallery { background: #444; }
    .btn-camera svg { width: 22px; height: 22px; pointer-events: none; }

    .preview-wrap {
      display: none;
      width: 100%; border-radius: 14px; overflow: hidden;
      margin-bottom: 1rem; background: #000; position: relative;
    }

    .preview-wrap img {
      width: 100%; display: block;
      max-height: 260px; object-fit: contain;
    }

    .processing-overlay {
      display: none;
      position: absolute; inset: 0;
      background: rgba(0,0,0,0.55);
      align-items: center; justify-content: center;
      flex-direction: column; gap: 12px;
      color: #fff; font-size: 14px;
    }

    .spinner {
      width: 36px; height: 36px;
      border: 3px solid rgba(255,255,255,0.3);
      border-top-color: #fff; border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .status-bar {
      text-align: center; font-size: 13px; color: #888;
      padding: 10px 0; min-height: 38px;
    }
    .status-bar.success { color: #16a34a; font-weight: 500; }
    .status-bar.error   { color: #dc2626; }
    .status-bar.loading { color: #1a56db; }

    /* ── Leituras pendentes ── */
    .pending { margin-bottom: 1rem; }
    .pending-title {
      font-size: 11px; font-weight: 500; color: #888; margin-bottom: 10px;
      text-transform: uppercase; letter-spacing: 0.6px;
    }
    .pending-item {
      background: #fff; padding: 10px 14px;
      border: 1px solid #e5e5e5; border-radius: 10px; margin-bottom: 6px;
      display: flex; align-items: center; gap: 10px;
    }
    .pending-item .code {
      flex: 1;
      font-size: 14px; font-weight: 500; color: #1a1a1a;
      display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
      word-break: break-all; line-height: 1.5;
    }
    .btn-remove {
      flex-shrink: 0;
      width: 28px; height: 28px;
      border-radius: 8px; border: 1px solid #fecaca;
      background: #fef2f2; color: #dc2626;
      font-size: 18px; line-height: 1; cursor: pointer;
      font-family: 'Poppins', sans-serif;
    }
    .btn-remove:active { opacity: 0.7; }

    .btn-confirmar {
      display: none;
      width: 100%; padding: 14px;
      background: #16a34a; color: #fff;
      border: none; border-radius: 14px;
      font-size: 15px; font-family: 'Poppins', sans-serif;
      font-weight: 500; cursor: pointer; margin-top: 4px;
    }
    .btn-confirmar:active { opacity: 0.8; }

    .result-card {
      background: #fff; border-radius: 12px;
      padding: 1rem 1.25rem; border: 1px solid #e5e5e5; margin-bottom: 1rem;
    }

    .result-label {
      font-size: 11px; color: #888; margin-bottom: 6px;
      text-transform: uppercase; letter-spacing: 0.6px;
    }

    .result-value {
      font-size: 15px; font-weight: 500; color: #1a1a1a;
      word-break: break-all; line-height: 1.5;
    }
    .result-value.empty { color: #bbb; font-weight: 400; font-style: italic; }

    .result-meta {
      font-size: 12px; color: #aaa; margin-top: 6px;
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    }

    .badge {
      display: inline-block; font-size: 11px; font-weight: 600;
      padding: 2px 8px; border-radius: 99px;
    }
    .badge-128 { background: #e8f0fe; color: #1a56db; }
    .badge-39  { background: #d1fae5; color: #065f46; }

    .history { margin-top: 1rem; padding-bottom: 2rem; }
    .history-title {
      font-size: 11px; font-weight: 500; color: #888; margin-bottom: 10px;
      text-transform: uppercase; letter-spacing: 0.6px;
    }

    .history-item {
      background: #fff; padding: 10px 14px;
      border: 1px solid #e5e5e5; border-radius: 10px; margin-bottom: 6px;
    }
    .history-item .code {
      font-size: 14px; font-weight: 500; color: #1a1a1a;
      display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
      word-break: break-all; line-height: 1.5;
    }
    .history-item .meta { font-size: 12px; color: #aaa; margin-top: 4px; }

    .popup-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.45);
      z-index: 9999;
      align-items: center;
      justify-content: center;
    }
    .popup-overlay.show { display: flex; }
    .popup-box {
      background: #fff;
      border-radius: 14px;
      padding: 24px 22px;
      width: 80%;
      max-width: 320px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,.2);
      animation: pop .2s ease-out;
    }
    @keyframes pop {
      from { transform: scale(.9); opacity: 0; }
      to   { transform: scale(1); opacity: 1; }
    }
    .popup-icon {
      width: 54px; height: 54px; line-height: 54px;
      border-radius: 50%;
      margin: 0 auto 14px;
      font-size: 28px; font-weight: bold; color: #fff;
    }
    .popup-msg { font-size: 15px; color: #333; margin-bottom: 18px; }
    .popup-btn {
      border: none; border-radius: 8px;
      padding: 10px 28px; font-size: 15px;
      color: #fff; cursor: pointer;
    }
    .popup-box.success .popup-icon,
    .popup-box.success .popup-btn { background: #2e7d32; }
    .popup-box.error   .popup-icon,
    .popup-box.error   .popup-btn { background: #c62828; }
    .popup-box.info    .popup-icon,
    .popup-box.info    .popup-btn { background: #1565c0; }

    .loading-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.45);
      z-index: 10000;
      align-items: center;
      justify-content: center;
    }
    .loading-overlay.show { display: flex; }
    .loading-box {
      background: #fff;
      border-radius: 14px;
      padding: 26px 30px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,.2);
    }
    .loading-spinner {
      width: 44px; height: 44px;
      margin: 0 auto 14px;
      border: 4px solid #e0e0e0;
      border-top-color: #1565c0;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-msg { font-size: 14px; color: #555; }
  </style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen" class="screen active">
  <div class="login-wrapper">
    <div class="logo">
      <svg viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="56" height="56" rx="14" fill="#B92633"/>
        <rect x="10" y="16" width="3" height="24" fill="white"/>
        <rect x="15" y="16" width="2" height="24" fill="white"/>
        <rect x="19" y="16" width="4" height="24" fill="white"/>
        <rect x="25" y="16" width="2" height="24" fill="white"/>
        <rect x="29" y="16" width="3" height="24" fill="white"/>
        <rect x="34" y="16" width="2" height="24" fill="white"/>
        <rect x="38" y="16" width="4" height="24" fill="white"/>
        <rect x="44" y="16" width="2" height="24" fill="white"/>
      </svg>
      <h1>Scanner NF</h1>
      <p>Leitura de código de barras</p>
    </div>
    <div class="card">
      <div class="field">
        <label>E-mail</label>
        <input type="email" id="login-name" autocomplete="off"
          onkeydown="if(event.key==='Enter') doLogin()">
      </div>
      <div class="field">
        <label>PIN</label>
        <input type="number" id="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" oninput="this.value=this.value.replace(/\D/g,'').slice(0,6)"
          onkeydown="if(event.key==='Enter') doLogin()">
      </div>
      <button class="btn-primary" onclick="doLogin()">Entrar</button>
    </div>
  </div>
</div>

<!-- SCANNER -->
<div id="scanner-screen" class="screen">
  <div class="header">
    <div class="user-badge">
      <div class="avatar" id="avatar-initials">--</div>
      <span class="user-name" id="user-name-display">Usuário</span>
    </div>
    <button class="btn-logout" onclick="doLogout()">Sair</button>
  </div>

  <div style="display:flex; gap:10px; margin-bottom:1rem;">
    <button class="btn-camera" onclick="triggerInput(true)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
        <circle cx="12" cy="13" r="4"/>
      </svg>
      Câmera
    </button>
    <button class="btn-camera gallery" onclick="triggerInput(false)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="2"/>
        <circle cx="8.5" cy="8.5" r="1.5"/>
        <polyline points="21 15 16 10 5 21"/>
      </svg>
      Galeria
    </button>
  </div>

  <div class="preview-wrap" id="preview-wrap">
    <img id="preview-img" src="" alt="Preview">
    <div class="processing-overlay" id="processing-overlay">
      <div class="spinner"></div>
      <span id="overlay-text">Lendo código...</span>
    </div>
  </div>

  <div id="status-bar" class="status-bar">Toque em Câmera para fotografar cada código</div>

  <!-- Leituras pendentes (lote) -->
  <div class="pending" id="pending-container" style="display:none">
    <div class="pending-title">Leituras pendentes (<span id="pending-count">0</span>)</div>
    <div id="pending-list"></div>
    <button id="btn-confirmar" class="btn-confirmar" onclick="confirmAll()">
      ✓ Confirmar envio
    </button>
  </div>

  <div class="result-card">
    <div class="result-label">Último código salvo</div>
    <div class="result-value empty" id="last-code">Nenhum código salvo ainda</div>
    <div class="result-meta" id="last-meta"></div>
  </div>

  <div class="history" id="history-container" style="display:none">
    <div class="history-title">Leituras desta sessão</div>
    <div id="history-list"></div>
  </div>
</div>

<script>
  let currentUser = '';
  let pendingReadings = [];   // [{ value, format, time }]
  let sessionHistory = [];
  let detector = null;

  let popupCallback = null;

  function showPopup(type, message, onClose) {
    const popup = document.getElementById('popup');
    const box   = popup.querySelector('.popup-box');
    const icon  = popup.querySelector('.popup-icon');
    const msg   = popup.querySelector('.popup-msg');
    const icons = { success: '✓', error: '✕', info: 'i' };
  
    box.className = 'popup-box ' + type;
    icon.textContent = icons[type] || 'i';
    msg.textContent  = message;
    popupCallback = onClose || null;
    popup.classList.add('show');
  }
  
  function closePopup() {
    document.getElementById('popup').classList.remove('show');
    if (popupCallback) { const cb = popupCallback; popupCallback = null; cb(); }
  }

  function showLoading(message) {
    const el = document.getElementById('loading');
    el.querySelector('.loading-msg').textContent = message || 'Carregando...';
    el.classList.add('show');
  }
  
  function hideLoading() {
    document.getElementById('loading').classList.remove('show');
  }

  // ── Detector ──────────────────────────────────────────────────────────────
  async function initDetector() {
    if (!('BarcodeDetector' in window)) return;
    try {
      const formats = (await BarcodeDetector.getSupportedFormats())
        .filter(f => ['code_128', 'code_39'].includes(f));
      if (formats.length > 0) detector = new BarcodeDetector({ formats });
    } catch(e) {}
  }

  // ── Input dinâmico — criado do zero a cada clique ─────────────────────────
  function triggerInput(useCamera) {
    const old = document.getElementById('_dyn_input');
    if (old) old.remove();

    const input = document.createElement('input');
    input.type = 'file';
    input.id = '_dyn_input';
    input.accept = 'image/*';
    if (useCamera) input.setAttribute('capture', 'environment');
    input.multiple = !useCamera;   // galeria: várias de uma vez | câmera: uma por vez
    input.style.cssText = 'position:fixed;top:-9999px;left:-9999px;opacity:0;';

    input.addEventListener('change', async (e) => {
      const files = Array.from(e.target.files || []);
      input.remove();
      for (const file of files) await processBlob(file);
    });

    document.body.appendChild(input);
    input.click();
  }

  // ── Processamento de imagem → adiciona à lista de pendentes ───────────────
  async function processBlob(blob) {
    if (!detector) {
      setStatus('BarcodeDetector não suportado — use Chrome Android', 'error');
      return;
    }

    const url = URL.createObjectURL(blob);
    const previewWrap = document.getElementById('preview-wrap');
    const previewImg = document.getElementById('preview-img');
    const overlay = document.getElementById('processing-overlay');

    previewImg.src = url;
    previewWrap.style.display = 'block';
    overlay.style.display = 'flex';
    document.getElementById('overlay-text').textContent = 'Lendo código...';
    setStatus('Analisando imagem...', 'loading');

    try {
      const bitmap = await createImageBitmap(blob);
      const barcodes = await detector.detect(bitmap);
      overlay.style.display = 'none';

      if (barcodes.length > 0) {
        const value = barcodes[0].rawValue;
        const format = barcodes[0].format;

        if (pendingReadings.some(r => r.value === value)) {
          setStatus('Esse código já está na lista de pendentes', 'error');
        } else {
          const now = new Date();
          pendingReadings.push({
            value,
            format,
            time: `${now.toLocaleDateString('pt-BR')} ${now.toLocaleTimeString('pt-BR')}`
          });
          savePending();
          renderPending();
          setStatus(`Código lido — ${pendingReadings.length} pendente${pendingReadings.length > 1 ? 's' : ''}`, 'success');
        }
      } else {
        setStatus('Nenhum código identificado — tente mais perto', 'error');
      }
    } catch(e) {
      overlay.style.display = 'none';
      setStatus('Erro ao processar imagem', 'error');
    }

    URL.revokeObjectURL(url);
  }

  // ── Helpers ───────────────────────────────────────────────────────────────
  function getInitials(name) {
    return name.trim().split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();
  }

  function setStatus(msg, type) {
    const el = document.getElementById('status-bar');
    el.textContent = msg;
    el.className = 'status-bar' + (type ? ' ' + type : '');
  }

  function savePending() {
    localStorage.setItem('scanner-pending', JSON.stringify(pendingReadings));
  }

  // ── Lista de pendentes ────────────────────────────────────────────────────
  function renderPending() {
    const container = document.getElementById('pending-container');
    const list = document.getElementById('pending-list');
    const btn = document.getElementById('btn-confirmar');

    if (!pendingReadings.length) {
      container.style.display = 'none';
      list.innerHTML = '';
      btn.style.display = 'none';
      return;
    }

    document.getElementById('pending-count').textContent = pendingReadings.length;
    list.innerHTML = pendingReadings.map((r, i) => {
      const formatLabel = r.format === 'code_128' ? '128' : '39';
      const badgeClass  = r.format === 'code_128' ? 'badge-128' : 'badge-39';
      return `
        <div class="pending-item">
          <div class="code"><span>${r.value}</span><span class="badge ${badgeClass}">Code ${formatLabel}</span></div>
          <button class="btn-remove" onclick="removePending(${i})" title="Remover">&times;</button>
        </div>`;
    }).join('');

    btn.textContent = `✓ Confirmar envio (${pendingReadings.length})`;
    btn.style.display = 'block';
    container.style.display = 'block';
  }

  function removePending(i) {
    pendingReadings.splice(i, 1);
    savePending();
    renderPending();
    setStatus(pendingReadings.length ? 'Item removido' : 'Lista de pendentes vazia', '');
  }

  // ── Histórico ─────────────────────────────────────────────────────────────
  function renderHistory() {
    if (!sessionHistory.length) return;
    const last = sessionHistory[0];
    document.getElementById('last-code').textContent = last.value;
    document.getElementById('last-code').classList.remove('empty');
    document.getElementById('last-meta').innerHTML =
      `<span class="badge ${last.badgeClass}">Code ${last.formatLabel}</span> ${last.time}`;
    document.getElementById('history-list').innerHTML = sessionHistory.slice(0, 20).map(h => `
      <div class="history-item">
        <div class="code"><span>${h.value}</span><span class="badge ${h.badgeClass}">Code ${h.formatLabel}</span></div>
        <div class="meta">${h.user} · ${h.time}</div>
      </div>
    `).join('');
    document.getElementById('history-container').style.display = 'block';
  }

  // ── Confirmar envio de TODAS as pendentes ─────────────────────────────────
  function confirmAll() {
    if (!pendingReadings.length) return;

    pendingReadings.forEach(r => {
      const formatLabel = r.format === 'code_128' ? '128' : '39';
      const badgeClass = r.format === 'code_128' ? 'badge-128' : 'badge-39';
      sessionHistory.unshift({
        value: r.value, formatLabel, badgeClass, time: r.time, user: currentUser
      });
    });
    /*
    const url = 'https://exemplo.com';
    const body = pendingReadings;

    try {
      const response = await fetch(url, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(body)
      });
  
      if (!response.ok) {
        throw new Error(`Erro na requisição: ${response.status}`);
      }
  
      const result = await response.json();
  
      if (!result) { alert('Não foi possível salvar a(s) leitura(s). Entre em contato com o time interno da Dux Trucking.'); return; };
      console.log('Sucesso:', result);
      
    } catch (erro) {
      console.error('Falha ao comunicar com a API:', erro);
    }
    */
    const count = pendingReadings.length;
    pendingReadings = [];
    localStorage.removeItem('scanner-pending');
    localStorage.setItem('scanner-history', JSON.stringify(sessionHistory));

    renderPending();
    renderHistory();
    document.getElementById('preview-wrap').style.display = 'none';
    setStatus(`${count} código${count > 1 ? 's' : ''} salvo${count > 1 ? 's' : ''} no histórico!`, 'success');
  }

  // ── Carregamento inicial ──────────────────────────────────────────────────
  window.addEventListener('load', async () => {
    await initDetector();

    const savedUser = localStorage.getItem('scanner-user');
    if (savedUser) {
      currentUser = savedUser;
      document.getElementById('user-name-display').textContent = savedUser;
      document.getElementById('avatar-initials').textContent = getInitials(savedUser);
      document.getElementById('login-screen').classList.remove('active');
      document.getElementById('scanner-screen').classList.add('active');
      setStatus(detector ? 'Pronto para leitura' : 'BarcodeDetector não suportado — use Chrome Android', detector ? '' : 'error');

      const savedHistory = localStorage.getItem('scanner-history');
      if (savedHistory) {
        try { sessionHistory = JSON.parse(savedHistory); renderHistory(); } catch(e) { sessionHistory = []; }
      }

      const savedPending = localStorage.getItem('scanner-pending');
      if (savedPending) {
        try {
          pendingReadings = JSON.parse(savedPending);
          // Descarta formato antigo (pré-lote) para não quebrar
          if (!Array.isArray(pendingReadings) ||
              (pendingReadings.length && typeof pendingReadings[0] !== 'object')) {
            pendingReadings = [];
            localStorage.removeItem('scanner-pending');
          }
        } catch(e) {
          pendingReadings = [];
        }
        renderPending();
        if (pendingReadings.length) {
          setStatus(`${pendingReadings.length} leitura(s) pendente(s) — confirme o envio`, 'success');
        }
      }
    }
  });

  // ── Login / Logout ────────────────────────────────────────────────────────
  async function doLogin() {
    showLoading('Carregando...');
    
    try {
      const name = document.getElementById('login-name').value.trim();
      const pin = document.getElementById('password').value.trim();
      if (!name) { showPopup('error', 'Digite seu e-mail para entrar'); return; }
      if (!pin) { showPopup('error', 'Digite a senha para entrar.'); return; }
      
      const url = 'https://n8n-dux.duckdns.org/webhook-test/login-scan-nf';
      const body = {"email": name, "pin": pin};
      
      const response = await fetch(url, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(body)
      });
  
      if (!response.ok) {        
        showPopup('error', `Erro no login: ${response.status}. Entre em contato com o time interno da Dux Trucking.`);
        throw new Error(`Erro na requisição: ${response.status}`);
        return;
      }
  
      const result = await response.json();
  
      if (!result.driver) {
        showPopup('error', 'Usuário ou senha inválida. Tente novamente.');
        return;
      }
      
      console.log('Sucesso:', result.message);
      pin.value = '';
      
      currentUser = result.driver;
      localStorage.setItem('scanner-user', currentUser);      
      document.getElementById('user-name-display').textContent = currentUser;
      document.getElementById('avatar-initials').textContent = getInitials(currentUser);
      document.getElementById('login-screen').classList.remove('active');
      document.getElementById('scanner-screen').classList.add('active');
      setStatus(detector ? 'Pronto para leitura' : 'BarcodeDetector não suportado — use Chrome Android', detector ? '' : 'error');
      
    } catch (erro) {
      console.error('Falha ao comunicar com a API:', erro);
      showPopup('error', 'Há algo errado. Entre em contato com o time interno da Dux Trucking.');
    } finally {
      hideLoading();
    }
  }

  function doLogout() {
    currentUser = '';
    sessionHistory = [];
    pendingReadings = [];
    localStorage.removeItem('scanner-user');
    localStorage.removeItem('scanner-history');
    localStorage.removeItem('scanner-pending');

    renderPending();
    document.getElementById('history-list').innerHTML = '';
    document.getElementById('history-container').style.display = 'none';
    document.getElementById('last-code').textContent = 'Nenhum código salvo ainda';
    document.getElementById('last-code').classList.add('empty');
    document.getElementById('last-meta').innerHTML = '';
    document.getElementById('login-name').value = '';
    document.getElementById('preview-wrap').style.display = 'none';
    document.getElementById('scanner-screen').classList.remove('active');
    document.getElementById('login-screen').classList.add('active');
  }
</script>

  <div id="popup" class="popup-overlay" onclick="if(event.target===this) closePopup()">
    <div class="popup-box">
      <div class="popup-icon"></div>
      <div class="popup-msg"></div>
      <button class="popup-btn" onclick="closePopup()">OK</button>
    </div>
  </div>

  <div id="loading" class="loading-overlay">
    <div class="loading-box">
      <div class="loading-spinner"></div>
      <div class="loading-msg">Carregando...</div>
    </div>
  </div>
