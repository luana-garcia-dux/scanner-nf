<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Scanner NF</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Poppins', sans-serif;
      background: #f5f5f5;
      color: #1a1a1a;
      min-height: 100vh;
    }

    .screen { display: none; padding: 2rem 1.5rem; max-width: 480px; margin: 0 auto; }
    .screen.active { display: block; }

    .login-wrapper {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .logo { text-align: center; margin-bottom: 2.5rem; }
    .logo svg { width: 56px; height: 56px; margin-bottom: 12px; }
    .logo h1 { font-size: 20px; font-weight: 600; color: #1a1a1a; }
    .logo p { font-size: 14px; color: #888; margin-top: 4px; }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 1.5rem;
      border: 1px solid #e5e5e5;
    }

    .field { margin-bottom: 1rem; }
    .field label { display: block; font-size: 13px; font-weight: 500; color: #555; margin-bottom: 6px; }

    input[type="text"] {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      font-family: 'Poppins', sans-serif;
      color: #1a1a1a;
      background: #fafafa;
      outline: none;
    }
    input[type="text"]:focus { border-color: #1a1a1a; background: #fff; }

    .btn-primary {
      width: 100%;
      padding: 14px;
      background: #1a1a1a;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-family: 'Poppins', sans-serif;
      font-weight: 500;
      cursor: pointer;
      margin-top: 0.5rem;
    }
    .btn-primary:active { opacity: 0.8; }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
      padding-top: 1rem;
    }

    .user-badge { display: flex; align-items: center; gap: 10px; }

    .avatar {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: #e8f0fe;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 600; color: #1a56db;
    }

    .user-name { font-size: 14px; font-weight: 500; }

    .btn-logout {
      font-size: 13px; color: #888; cursor: pointer;
      padding: 6px 12px; border: 1px solid #ddd;
      border-radius: 8px; background: #fff;
      font-family: 'Poppins', sans-serif;
    }

    .btn-camera-wrap { position: relative; flex: 1; }

    .btn-camera-wrap input[type="file"] {
      position: absolute;
      inset: 0; width: 100%; height: 100%;
      opacity: 0; cursor: pointer; font-size: 0;
    }

    .btn-camera {
      width: 100%;
      padding: 16px 14px;
      background: #1a1a1a;
      color: #fff;
      border: none;
      border-radius: 14px;
      font-size: 15px;
      font-family: 'Poppins', sans-serif;
      font-weight: 500;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      pointer-events: none;
    }

    .btn-camera.gallery { background: #444; }
    .btn-camera svg { width: 22px; height: 22px; }

    .preview-wrap {
      display: none;
      width: 100%; border-radius: 14px; overflow: hidden;
      margin-bottom: 1rem; background: #000; position: relative;
    }

    .preview-wrap img {
      width: 100%; display: block;
      max-height: 260px; object-fit: contain;
    }

    .processing-overlay {
      display: none;
      position: absolute; inset: 0;
      background: rgba(0,0,0,0.55);
      align-items: center; justify-content: center;
      flex-direction: column; gap: 12px;
      color: #fff; font-size: 14px;
    }

    .spinner {
      width: 36px; height: 36px;
      border: 3px solid rgba(255,255,255,0.3);
      border-top-color: #fff; border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .status-bar {
      text-align: center; font-size: 13px; color: #888;
      padding: 10px 0; min-height: 38px;
    }
    .status-bar.success { color: #16a34a; font-weight: 500; }
    .status-bar.error   { color: #dc2626; }
    .status-bar.loading { color: #1a56db; }

    .result-card {
      background: #fff; border-radius: 12px;
      padding: 1rem 1.25rem; border: 1px solid #e5e5e5; margin-bottom: 1rem;
    }

    .result-label {
      font-size: 11px; color: #888; margin-bottom: 6px;
      text-transform: uppercase; letter-spacing: 0.6px;
    }

    .result-value {
      font-size: 15px; font-weight: 500; color: #1a1a1a;
      word-break: break-all; line-height: 1.5;
    }
    .result-value.empty { color: #bbb; font-weight: 400; font-style: italic; }

    .result-meta {
      font-size: 12px; color: #aaa; margin-top: 6px;
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    }

    .badge {
      display: inline-block; font-size: 11px; font-weight: 600;
      padding: 2px 8px; border-radius: 99px;
    }
    .badge-128 { background: #e8f0fe; color: #1a56db; }
    .badge-39  { background: #d1fae5; color: #065f46; }

    .history { margin-top: 1rem; padding-bottom: 2rem; }
    .history-title {
      font-size: 11px; font-weight: 500; color: #888; margin-bottom: 10px;
      text-transform: uppercase; letter-spacing: 0.6px;
    }

    .history-item {
      background: #fff; padding: 10px 14px;
      border: 1px solid #e5e5e5; border-radius: 10px; margin-bottom: 6px;
    }
    .history-item .code {
      font-size: 14px; font-weight: 500; color: #1a1a1a;
      display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    }
    .history-item .meta { font-size: 12px; color: #aaa; margin-top: 4px; }
  </style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen" class="screen active">
  <div class="login-wrapper">
    <div class="logo">
      <svg viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="56" height="56" rx="14" fill="#1a1a1a"/>
        <rect x="10" y="16" width="3" height="24" fill="white"/>
        <rect x="15" y="16" width="2" height="24" fill="white"/>
        <rect x="19" y="16" width="4" height="24" fill="white"/>
        <rect x="25" y="16" width="2" height="24" fill="white"/>
        <rect x="29" y="16" width="3" height="24" fill="white"/>
        <rect x="34" y="16" width="2" height="24" fill="white"/>
        <rect x="38" y="16" width="4" height="24" fill="white"/>
        <rect x="44" y="16" width="2" height="24" fill="white"/>
      </svg>
      <h1>Scanner NF</h1>
      <p>Leitura de código de barras</p>
    </div>
    <div class="card">
      <div class="field">
        <label>E-mail</label>
        <input type="text" id="login-name" autocomplete="off"
          onkeydown="if(event.key==='Enter') doLogin()">
      </div>
      <button class="btn-primary" onclick="doLogin()">Entrar</button>
    </div>
  </div>
</div>

<!-- SCANNER -->
<div id="scanner-screen" class="screen">
  <div class="header">
    <div class="user-badge">
      <div class="avatar" id="avatar-initials">--</div>
      <span class="user-name" id="user-name-display">Usuário</span>
    </div>
    <button class="btn-logout" onclick="doLogout()">Sair</button>
  </div>

  <div style="display:flex; gap:10px; margin-bottom:1rem;">
    <div class="btn-camera-wrap">
      <input type="file" accept="image/*" capture="environment" id="camera-input" onchange="onPhoto(event)">
      <div class="btn-camera">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
          <circle cx="12" cy="13" r="4"/>
        </svg>
        Câmera
      </div>
    </div>
    <div class="btn-camera-wrap">
      <input type="file" accept="image/*" multiple id="gallery-input" onchange="onPhoto(event)">
      <div class="btn-camera gallery">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <circle cx="8.5" cy="8.5" r="1.5"/>
          <polyline points="21 15 16 10 5 21"/>
        </svg>
        Galeria
      </div>
    </div>
  </div>

  <div class="preview-wrap" id="preview-wrap">
    <img id="preview-img" src="" alt="Preview">
    <div class="processing-overlay" id="processing-overlay">
      <div class="spinner"></div>
      <span id="overlay-text">Lendo código...</span>
    </div>
  </div>

  <div id="status-bar" class="status-bar">Toque no botão para fotografar o código</div>

  <div class="result-card">
    <div class="result-label">Último código lido</div>
    <div class="result-value empty" id="last-code">Nenhum código lido ainda</div>
    <div class="result-meta" id="last-meta"></div>
  </div>

  <div class="history" id="history-container" style="display:none">
    <div class="history-title">Leituras desta sessão</div>
    <div id="history-list"></div>
  </div>
</div>

<script>
  let currentUser = '';
  let sessionHistory = [];
  let detector = null;

  async function initDetector() {
    if (!('BarcodeDetector' in window)) return;
    try {
      const formats = (await BarcodeDetector.getSupportedFormats())
        .filter(f => ['code_128', 'code_39'].includes(f));
      if (formats.length > 0) detector = new BarcodeDetector({ formats });
    } catch(e) {}
  }

  function getInitials(name) {
    return name.trim().split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();
  }

  function setStatus(msg, type) {
    const el = document.getElementById('status-bar');
    el.textContent = msg;
    el.className = 'status-bar' + (type ? ' ' + type : '');
  }

  function renderHistory() {
    if (!sessionHistory.length) return;
    const last = sessionHistory[0];
    document.getElementById('last-code').textContent = last.value;
    document.getElementById('last-code').classList.remove('empty');
    document.getElementById('last-meta').innerHTML =
      `<span class="badge ${last.badgeClass}">Code ${last.formatLabel}</span> ${last.time}`;
    document.getElementById('history-list').innerHTML = sessionHistory.slice(0, 20).map(h => `
      <div class="history-item">
        <div class="code"><span>${h.value}</span><span class="badge ${h.badgeClass}">Code ${h.formatLabel}</span></div>
        <div class="meta">${h.user} · ${h.time}</div>
      </div>
    `).join('');
    document.getElementById('history-container').style.display = 'block';
  }

  // Restaura sessão ao recarregar (Android mata o browser ao abrir câmera)
  window.addEventListener('load', async () => {
    await initDetector();

    const savedUser = sessionStorage.getItem('scanner-user');
    if (savedUser) {
      currentUser = savedUser;
      document.getElementById('user-name-display').textContent = savedUser;
      document.getElementById('avatar-initials').textContent = getInitials(savedUser);
      document.getElementById('login-screen').classList.remove('active');
      document.getElementById('scanner-screen').classList.add('active');
      setStatus(detector ? 'Pronto para leitura' : 'BarcodeDetector não suportado — use Chrome Android', detector ? '' : 'error');

      const savedHistory = sessionStorage.getItem('scanner-history');
      if (savedHistory) {
        sessionHistory = JSON.parse(savedHistory);
        renderHistory();
      }
    }
  });

  function doLogin() {
    const name = document.getElementById('login-name').value.trim();
    if (!name) { alert('Digite seu e-mail para entrar.'); return; }
    currentUser = name;
    sessionStorage.setItem('scanner-user', name);
    document.getElementById('user-name-display').textContent = name;
    document.getElementById('avatar-initials').textContent = getInitials(name);
    document.getElementById('login-screen').classList.remove('active');
    document.getElementById('scanner-screen').classList.add('active');
    setStatus(detector ? 'Pronto para leitura' : 'BarcodeDetector não suportado — use Chrome Android', detector ? '' : 'error');
  }

  function doLogout() {
    currentUser = '';
    sessionHistory = [];
    sessionStorage.removeItem('scanner-user');
    sessionStorage.removeItem('scanner-history');
    document.getElementById('history-list').innerHTML = '';
    document.getElementById('history-container').style.display = 'none';
    document.getElementById('last-code').textContent = 'Nenhum código lido ainda';
    document.getElementById('last-code').classList.add('empty');
    document.getElementById('last-meta').innerHTML = '';
    document.getElementById('login-name').value = '';
    document.getElementById('preview-wrap').style.display = 'none';
    document.getElementById('scanner-screen').classList.remove('active');
    document.getElementById('login-screen').classList.add('active');
  }

  async function onPhoto(event) {
    const files = Array.from(event.target.files);
    if (!files.length) return;
    event.target.value = null;

    if (!detector) {
      setStatus('Detector não disponível — use Chrome Android', 'error');
      return;
    }

    const total = files.length;
    let success = 0, failed = 0;

    const previewWrap = document.getElementById('preview-wrap');
    const previewImg  = document.getElementById('preview-img');
    const overlay     = document.getElementById('processing-overlay');
    const overlayText = document.getElementById('overlay-text');

    for (let i = 0; i < files.length; i++) {
      const url = URL.createObjectURL(files[i]);
      previewImg.src = url;
      previewWrap.style.display = 'block';
      overlay.style.display = 'flex';
      overlayText.textContent = total > 1 ? `Lendo ${i + 1} de ${total}...` : 'Lendo código...';
      setStatus(total > 1 ? `Analisando ${i + 1} de ${total}...` : 'Analisando imagem...', 'loading');

      try {
        const bitmap   = await createImageBitmap(files[i]);
        const barcodes = await detector.detect(bitmap);
        overlay.style.display = 'none';
        if (barcodes.length > 0) { onBarcodeFound(barcodes[0].rawValue, barcodes[0].format); success++; }
        else failed++;
      } catch(e) {
        overlay.style.display = 'none';
        failed++;
      }
      URL.revokeObjectURL(url);
    }

    if (total > 1) {
      if (failed === 0) setStatus(`${total} códigos lidos com sucesso!`, 'success');
      else if (success === 0) setStatus(`Nenhum código identificado nas ${total} imagens`, 'error');
      else setStatus(`${success} lido${success > 1 ? 's' : ''}, ${failed} não identificado${failed > 1 ? 's' : ''}`, '');
    }
  }

  function onBarcodeFound(value, format) {
    const now = new Date();
    const timeStr = now.toLocaleTimeString('pt-BR');
    const dateStr = now.toLocaleDateString('pt-BR');
    const formatLabel = format === 'code_128' ? '128' : '39';
    const badgeClass  = format === 'code_128' ? 'badge-128' : 'badge-39';

    sessionHistory.unshift({ value, formatLabel, badgeClass, time: `${dateStr} ${timeStr}`, user: currentUser });
    sessionStorage.setItem('scanner-history', JSON.stringify(sessionHistory));

    document.getElementById('last-code').textContent = value;
    document.getElementById('last-code').classList.remove('empty');
    document.getElementById('last-meta').innerHTML =
      `<span class="badge ${badgeClass}">Code ${formatLabel}</span> ${dateStr} ${timeStr}`;
    setStatus('Código lido com sucesso!', 'success');

    renderHistory();
  }
</script>
</body>
</html>
