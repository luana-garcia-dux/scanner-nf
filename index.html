<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Scanner NF</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Poppins', sans-serif;
      background: #f5f5f5;
      color: #1a1a1a;
      min-height: 100vh;
    }

    .screen { display: none; padding: 2rem 1.5rem; max-width: 480px; margin: 0 auto; }
    .screen.active { display: block; }

    .login-wrapper {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .logo { text-align: center; margin-bottom: 2.5rem; }
    .logo svg { width: 56px; height: 56px; margin-bottom: 12px; }
    .logo h1 { font-size: 20px; font-weight: 600; color: #1a1a1a; }
    .logo p { font-size: 14px; color: #888; margin-top: 4px; }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 1.5rem;
      border: 1px solid #e5e5e5;
    }

    .field { margin-bottom: 1rem; }
    .field label { display: block; font-size: 13px; font-weight: 500; color: #555; margin-bottom: 6px; }

    input[type="text"], input[type="email"] {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      font-family: 'Poppins', sans-serif;
      color: #1a1a1a;
      background: #fafafa;
      outline: none;
    }
    input[type="text"]:focus, input[type="email"]:focus { border-color: #1a1a1a; background: #fff; }

    .btn-primary {
      width: 100%;
      padding: 14px;
      background: #1a1a1a;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-family: 'Poppins', sans-serif;
      font-weight: 500;
      cursor: pointer;
      margin-top: 0.5rem;
    }
    .btn-primary:active { opacity: 0.8; }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
      padding-top: 1rem;
    }

    .user-badge { display: flex; align-items: center; gap: 10px; }

    .avatar {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: #e8f0fe;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 600; color: #1a56db;
    }

    .user-name { font-size: 14px; font-weight: 500; }

    .btn-logout {
      font-size: 13px; color: #888; cursor: pointer;
      padding: 6px 12px; border: 1px solid #ddd;
      border-radius: 8px; background: #fff;
      font-family: 'Poppins', sans-serif;
    }

    .btn-camera-wrap { position: relative; flex: 1; }

    /* container do input file (galeria) */
    .btn-camera-wrap input[type="file"] {
      position: absolute;
      inset: 0; width: 100%; height: 100%;
      opacity: 0; cursor: pointer; font-size: 0;
    }

    .btn-camera {
      width: 100%;
      padding: 16px 14px;
      background: #1a1a1a;
      color: #fff;
      border: none;
      border-radius: 14px;
      font-size: 15px;
      font-family: 'Poppins', sans-serif;
      font-weight: 500;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      cursor: pointer;
    }

    .btn-camera.gallery { background: #444; }
    .btn-camera svg { width: 22px; height: 22px; pointer-events: none; }

    /* Câmera — botão direto (não usa input file) */
    #btn-camera-real {
      pointer-events: auto;
    }

    /* Vídeo câmera traseira */
    #camera-modal {
      display: none;
      position: fixed; inset: 0; z-index: 100;
      background: #000;
      flex-direction: column;
      align-items: center; justify-content: flex-start;
    }
    #camera-modal.open { display: flex; }

    #qr-reader {
      width: 100%;
      max-width: 480px;
    }

    /* Esconde elementos desnecessários do html5-qrcode */
    #qr-reader__header_message,
    #qr-reader__status_span,
    #qr-reader__dashboard_section_csr span,
    #qr-reader select { display: none !important; }

    #qr-reader__dashboard { background: #000; padding: 0; }
    #qr-reader__dashboard_section_swaplink { color: #fff; font-size: 13px; }

    .camera-controls {
      display: flex; gap: 20px; padding: 16px;
      width: 100%; justify-content: center; align-items: center;
    }

    .btn-cancel-cam {
      font-size: 14px; color: #fff;
      background: transparent; border: 1px solid #555;
      padding: 10px 20px; border-radius: 10px;
      font-family: 'Poppins', sans-serif; cursor: pointer;
    }

    canvas#snap-canvas { display: none; }

    .preview-wrap {
      display: none;
      width: 100%; border-radius: 14px; overflow: hidden;
      margin-bottom: 1rem; background: #000; position: relative;
    }

    .preview-wrap img {
      width: 100%; display: block;
      max-height: 260px; object-fit: contain;
    }

    .processing-overlay {
      display: none;
      position: absolute; inset: 0;
      background: rgba(0,0,0,0.55);
      align-items: center; justify-content: center;
      flex-direction: column; gap: 12px;
      color: #fff; font-size: 14px;
    }

    .spinner {
      width: 36px; height: 36px;
      border: 3px solid rgba(255,255,255,0.3);
      border-top-color: #fff; border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .status-bar {
      text-align: center; font-size: 13px; color: #888;
      padding: 10px 0; min-height: 38px;
    }
    .status-bar.success { color: #16a34a; font-weight: 500; }
    .status-bar.error   { color: #dc2626; }
    .status-bar.loading { color: #1a56db; }

    .btn-confirmar {
      display: none;
      width: 100%; padding: 14px;
      background: #16a34a; color: #fff;
      border: none; border-radius: 14px;
      font-size: 15px; font-family: 'Poppins', sans-serif;
      font-weight: 500; cursor: pointer; margin-bottom: 1rem;
    }
    .btn-confirmar:active { opacity: 0.8; }

    .result-card {
      background: #fff; border-radius: 12px;
      padding: 1rem 1.25rem; border: 1px solid #e5e5e5; margin-bottom: 1rem;
    }

    .result-label {
      font-size: 11px; color: #888; margin-bottom: 6px;
      text-transform: uppercase; letter-spacing: 0.6px;
    }

    .result-value {
      font-size: 15px; font-weight: 500; color: #1a1a1a;
      word-break: break-all; line-height: 1.5;
    }
    .result-value.empty { color: #bbb; font-weight: 400; font-style: italic; }

    .result-meta {
      font-size: 12px; color: #aaa; margin-top: 6px;
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    }

    .badge {
      display: inline-block; font-size: 11px; font-weight: 600;
      padding: 2px 8px; border-radius: 99px;
    }
    .badge-128 { background: #e8f0fe; color: #1a56db; }
    .badge-39  { background: #d1fae5; color: #065f46; }

    .history { margin-top: 1rem; padding-bottom: 2rem; }
    .history-title {
      font-size: 11px; font-weight: 500; color: #888; margin-bottom: 10px;
      text-transform: uppercase; letter-spacing: 0.6px;
    }

    .history-item {
      background: #fff; padding: 10px 14px;
      border: 1px solid #e5e5e5; border-radius: 10px; margin-bottom: 6px;
    }
    .history-item .code {
      font-size: 14px; font-weight: 500; color: #1a1a1a;
      display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
      word-break: break-all; line-height: 1.5;
    }
    .history-item .meta { font-size: 12px; color: #aaa; margin-top: 4px; }
  </style>
</head>
<body>

<!-- MODAL CÂMERA TRASEIRA -->
<div id="camera-modal">
  <div id="qr-reader"></div>
  <div class="camera-controls">
    <button class="btn-cancel-cam" onclick="closeCamera()">Cancelar</button>
  </div>
</div>

<!-- LOGIN -->
<div id="login-screen" class="screen active">
  <div class="login-wrapper">
    <div class="logo">
      <svg viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="56" height="56" rx="14" fill="#1a1a1a"/>
        <rect x="10" y="16" width="3" height="24" fill="white"/>
        <rect x="15" y="16" width="2" height="24" fill="white"/>
        <rect x="19" y="16" width="4" height="24" fill="white"/>
        <rect x="25" y="16" width="2" height="24" fill="white"/>
        <rect x="29" y="16" width="3" height="24" fill="white"/>
        <rect x="34" y="16" width="2" height="24" fill="white"/>
        <rect x="38" y="16" width="4" height="24" fill="white"/>
        <rect x="44" y="16" width="2" height="24" fill="white"/>
      </svg>
      <h1>Scanner NF</h1>
      <p>Leitura de código de barras</p>
    </div>
    <div class="card">
      <div class="field">
        <label>E-mail</label>
        <input type="email" id="login-name" autocomplete="off"
          onkeydown="if(event.key==='Enter') doLogin()">
      </div>
      <button class="btn-primary" onclick="doLogin()">Entrar</button>
    </div>
  </div>
</div>

<!-- SCANNER -->
<div id="scanner-screen" class="screen">
  <div class="header">
    <div class="user-badge">
      <div class="avatar" id="avatar-initials">--</div>
      <span class="user-name" id="user-name-display">Usuário</span>
    </div>
    <button class="btn-logout" onclick="doLogout()">Sair</button>
  </div>

  <div style="display:flex; gap:10px; margin-bottom:1rem;">
    <!-- CÂMERA: botão direto, sem input file -->
    <div class="btn-camera-wrap" style="position:static;">
      <button class="btn-camera" id="btn-camera-real" onclick="openCamera()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
          <circle cx="12" cy="13" r="4"/>
        </svg>
        Câmera
      </button>
    </div>

    <!-- GALERIA: input file normal -->
    <div class="btn-camera-wrap">
      <input type="file" accept="image/*" multiple id="gallery-input" onchange="onPhoto(event)">
      <div class="btn-camera gallery">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <circle cx="8.5" cy="8.5" r="1.5"/>
          <polyline points="21 15 16 10 5 21"/>
        </svg>
        Galeria
      </div>
    </div>
  </div>

  <div class="preview-wrap" id="preview-wrap">
    <img id="preview-img" src="" alt="Preview">
    <div class="processing-overlay" id="processing-overlay">
      <div class="spinner"></div>
      <span id="overlay-text">Lendo código...</span>
    </div>
  </div>

  <div id="status-bar" class="status-bar">Toque no botão para fotografar o código</div>

  <button id="btn-confirmar" class="btn-confirmar" onclick="onBarcodeFound()">
    ✓ Confirmar leitura
  </button>

  <div class="result-card">
    <div class="result-label">Último código lido</div>
    <div class="result-value empty" id="last-code">Nenhum código lido ainda</div>
    <div class="result-meta" id="last-meta"></div>
  </div>

  <div class="history" id="history-container" style="display:none">
    <div class="history-title">Leituras desta sessão</div>
    <div id="history-list"></div>
  </div>
</div>

<script>
  let currentUser = '';
  let newCode = [];
  let sessionHistory = [];
  let detector = null;
  let html5QrCode = null;

  // ── Detector ──────────────────────────────────────────────────────────────
  async function initDetector() {
    if (!('BarcodeDetector' in window)) return;
    try {
      const formats = (await BarcodeDetector.getSupportedFormats())
        .filter(f => ['code_128', 'code_39'].includes(f));
      if (formats.length > 0) detector = new BarcodeDetector({ formats });
    } catch(e) {}
  }

  // ── Câmera traseira via html5-qrcode ──────────────────────────────────────
  async function openCamera() {
    document.getElementById('camera-modal').classList.add('open');

    html5QrCode = new Html5Qrcode('qr-reader');

    try {
      await html5QrCode.start(
        { facingMode: { exact: 'environment' } },
        {
          fps: 10,
          qrbox: { width: 280, height: 120 },
          formatsToSupport: [
            Html5QrcodeSupportedFormats.CODE_128,
            Html5QrcodeSupportedFormats.CODE_39
          ]
        },
        async (decodedText, decodedResult) => {
          const format = decodedResult.result.format.formatName.toLowerCase().replace(' ', '_');
          newCode = [decodedText, format];
          localStorage.setItem('scanner-pending', JSON.stringify(newCode));
          await closeCamera();
          document.getElementById('btn-confirmar').style.display = 'block';
          setStatus('Código lido — confirme para salvar', 'success');
        },
        () => {} // erros de frame ignorados
      );
    } catch(e) {
      // fallback sem "exact"
      try {
        await html5QrCode.start(
          { facingMode: 'environment' },
          {
            fps: 10,
            qrbox: { width: 280, height: 120 },
            formatsToSupport: [
              Html5QrcodeSupportedFormats.CODE_128,
              Html5QrcodeSupportedFormats.CODE_39
            ]
          },
          async (decodedText, decodedResult) => {
            const format = decodedResult.result.format.formatName.toLowerCase().replace(' ', '_');
            newCode = [decodedText, format];
            localStorage.setItem('scanner-pending', JSON.stringify(newCode));
            await closeCamera();
            document.getElementById('btn-confirmar').style.display = 'block';
            setStatus('Código lido — confirme para salvar', 'success');
          },
          () => {}
        );
      } catch(e2) {
        closeCamera();
        alert('Não foi possível acessar a câmera. Verifique as permissões.');
      }
    }
  }

  async function closeCamera() {
    document.getElementById('camera-modal').classList.remove('open');
    if (html5QrCode) {
      try {
        const state = html5QrCode.getState();
        if (state === Html5QrcodeScannerState.SCANNING || state === Html5QrcodeScannerState.PAUSED) {
          await html5QrCode.stop();
        }
      } catch(e) {}
      html5QrCode = null;
    }
  }

  // ── Galeria ───────────────────────────────────────────────────────────────
  async function onPhoto(event) {
    const files = Array.from(event.target.files);
    // Recria o input para evitar bug de "preso" no Android
    resetGalleryInput();
    if (!files.length) return;
    for (const file of files) await processBlob(file);
  }

  function resetGalleryInput() {
    const old = document.getElementById('gallery-input');
    const newInput = document.createElement('input');
    newInput.type = 'file';
    newInput.accept = 'image/*';
    newInput.multiple = true;
    newInput.id = 'gallery-input';
    newInput.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0;';
    newInput.addEventListener('change', onPhoto);
    old.parentNode.replaceChild(newInput, old);
  }

  // ── Processamento de imagem ───────────────────────────────────────────────
  async function processBlob(blob) {
    if (!detector) {
      setStatus('BarcodeDetector não suportado — use Chrome Android', 'error');
      return;
    }

    const url = URL.createObjectURL(blob);
    const previewWrap = document.getElementById('preview-wrap');
    const previewImg  = document.getElementById('preview-img');
    const overlay     = document.getElementById('processing-overlay');

    previewImg.src = url;
    previewWrap.style.display = 'block';
    overlay.style.display = 'flex';
    document.getElementById('overlay-text').textContent = 'Lendo código...';
    setStatus('Analisando imagem...', 'loading');

    try {
      const bitmap   = await createImageBitmap(blob);
      const barcodes = await detector.detect(bitmap);
      overlay.style.display = 'none';

      if (barcodes.length > 0) {
        newCode = [barcodes[0].rawValue, barcodes[0].format];
        localStorage.setItem('scanner-pending', JSON.stringify(newCode));
        document.getElementById('btn-confirmar').style.display = 'block';
        setStatus('Código lido — confirme para salvar', 'success');
      } else {
        setStatus('Nenhum código identificado — tente mais perto', 'error');
      }
    } catch(e) {
      overlay.style.display = 'none';
      setStatus('Erro ao processar imagem', 'error');
    }

    URL.revokeObjectURL(url);
  }

  // ── Helpers ───────────────────────────────────────────────────────────────
  function getInitials(name) {
    return name.trim().split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();
  }

  function setStatus(msg, type) {
    const el = document.getElementById('status-bar');
    el.textContent = msg;
    el.className = 'status-bar' + (type ? ' ' + type : '');
  }

  function renderHistory() {
    if (!sessionHistory.length) return;
    const last = sessionHistory[0];
    document.getElementById('last-code').textContent = last.value;
    document.getElementById('last-code').classList.remove('empty');
    document.getElementById('last-meta').innerHTML =
      `<span class="badge ${last.badgeClass}">Code ${last.formatLabel}</span> ${last.time}`;
    document.getElementById('history-list').innerHTML = sessionHistory.slice(0, 20).map(h => `
      <div class="history-item">
        <div class="code"><span>${h.value}</span><span class="badge ${h.badgeClass}">Code ${h.formatLabel}</span></div>
        <div class="meta">${h.user} · ${h.time}</div>
      </div>
    `).join('');
    document.getElementById('history-container').style.display = 'block';
  }

  // ── Login / Logout ────────────────────────────────────────────────────────
  window.addEventListener('load', async () => {
    await initDetector();

    const savedUser = localStorage.getItem('scanner-user');
    if (savedUser) {
      currentUser = savedUser;
      document.getElementById('user-name-display').textContent = savedUser;
      document.getElementById('avatar-initials').textContent = getInitials(savedUser);
      document.getElementById('login-screen').classList.remove('active');
      document.getElementById('scanner-screen').classList.add('active');
      setStatus(detector ? 'Pronto para leitura' : 'BarcodeDetector não suportado — use Chrome Android', detector ? '' : 'error');

      const savedHistory = localStorage.getItem('scanner-history');
      if (savedHistory) { sessionHistory = JSON.parse(savedHistory); renderHistory(); }

      const savedPending = localStorage.getItem('scanner-pending');
      if (savedPending) {
        newCode = JSON.parse(savedPending);
        document.getElementById('btn-confirmar').style.display = 'block';
        setStatus('Código detectado — confirme para salvar', 'success');
      }
    }
  });

  async function doLogin() {
    const name = document.getElementById('login-name').value.trim();
    if (!name) { alert('Digite seu e-mail para entrar.'); return; }

    currentUser = name;
    localStorage.setItem('scanner-user', name);
    document.getElementById('user-name-display').textContent = name;
    document.getElementById('avatar-initials').textContent = getInitials(name);
    document.getElementById('login-screen').classList.remove('active');
    document.getElementById('scanner-screen').classList.add('active');
    setStatus(detector ? 'Pronto para leitura' : 'BarcodeDetector não suportado — use Chrome Android', detector ? '' : 'error');
  }

  async function doLogout() {
    await closeCamera();
    currentUser = '';
    sessionHistory = [];
    newCode = [];
    localStorage.removeItem('scanner-user');
    localStorage.removeItem('scanner-history');
    localStorage.removeItem('scanner-pending');
    document.getElementById('btn-confirmar').style.display = 'none';
    document.getElementById('history-list').innerHTML = '';
    document.getElementById('history-container').style.display = 'none';
    document.getElementById('last-code').textContent = 'Nenhum código lido ainda';
    document.getElementById('last-code').classList.add('empty');
    document.getElementById('last-meta').innerHTML = '';
    document.getElementById('login-name').value = '';
    document.getElementById('preview-wrap').style.display = 'none';
    document.getElementById('scanner-screen').classList.remove('active');
    document.getElementById('login-screen').classList.add('active');
  }

  // ── Confirmar leitura ─────────────────────────────────────────────────────
  function onBarcodeFound() {
    document.getElementById('btn-confirmar').style.display = 'none';
    if (!newCode.length) return;

    const value = newCode[0];
    const format = newCode[1];
    newCode = [];
    localStorage.removeItem('scanner-pending');

    const now = new Date();
    const timeStr = now.toLocaleTimeString('pt-BR');
    const dateStr = now.toLocaleDateString('pt-BR');
    const formatLabel = format === 'code_128' ? '128' : '39';
    const badgeClass  = format === 'code_128' ? 'badge-128' : 'badge-39';

    sessionHistory.unshift({ value, formatLabel, badgeClass, time: `${dateStr} ${timeStr}`, user: currentUser });
    localStorage.setItem('scanner-history', JSON.stringify(sessionHistory));

    document.getElementById('last-code').textContent = value;
    document.getElementById('last-code').classList.remove('empty');
    document.getElementById('last-meta').innerHTML =
      `<span class="badge ${badgeClass}">Code ${formatLabel}</span> ${dateStr} ${timeStr}`;
    setStatus('Código salvo no histórico!', 'success');

    renderHistory();
  }
</script>
</body>
</html>
